name: Materialize Android source
on:
  push:
    branches: [feat/android-ble-foundation]
    paths: [.github/workflows/materialize.yml]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and materialize reviewed source files
        run: |
          python3 - <<'PYCODE'
          import base64, hashlib, json, pathlib
          raw = pathlib.Path('.hiru-source.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'bbf37af1818e9016ea47b1ef70616b4d6c235070b261ca0300239290c0bb8478'
          for name, encoded in json.loads(raw).items():
              path = pathlib.PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              target = pathlib.Path(name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(encoded, validate=True))
          pathlib.Path('android/gradlew').chmod(0o755)
          PYCODE
          git rm .hiru-source.json .github/workflows/materialize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Implement Android Compose UI and authenticated BLE hotspot requests'
          git push origin HEAD:feat/android-ble-foundation
